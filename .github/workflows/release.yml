# CD: publica a imagem no GitHub Container Registry.
#
# Dispara no push de `main`, que por política só acontece por merge de PR vindo
# de `development` — PR esse que já passou pela CI e pelo Security. Encadear
# este workflow a um `workflow_run` da CI daria a mesma garantia com um
# workflow rodando num contexto de commit diferente do que disparou; o ruleset
# de `main` é o lugar certo para essa garantia morar.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Attestation assinada por OIDC: prova que a imagem saiu deste
      # repositório, neste workflow, neste commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # O nome deste repositório tem maiúsculas e o GHCR só aceita
      # minúsculas. O metadata-action normaliza sozinho, mas o
      # attest-build-provenance não: o subject-name precisa bater caractere a
      # caractere com a imagem publicada, então o nome é calculado uma vez e
      # usado pelos dois.
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=NexusOps Frontend
            org.opencontainers.image.description=Frontend do NexusOps — SaaS B2B multi-tenant de helpdesk interno
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache no próprio Actions: sem ele o `npm ci` do estágio deps roda
          # inteiro a cada release.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
