version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Sao_Paulo
    # SEM ISTO o Dependabot abre PR contra a branch default (main), violando a
    # política de release na primeira atualização que ele propuser.
    target-branch: development
    open-pull-requests-limit: 5
    commit-message:
      # Commitlint roda na CI e no hook: prefixo fora do padrão faz o próprio
      # PR do Dependabot reprovar no job `commits`.
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Um PR por família em vez de um por pacote. React, Next e TanStack
      # sobem em conjunto e revisá-los separados é revisar a mesma mudança
      # três vezes.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      testing:
        patterns: ["jest", "jest-*", "@types/jest", "@testing-library/*", "@playwright/*", "playwright"]
      linting:
        patterns: ["eslint", "typescript-eslint", "eslint-plugin-*", "@commitlint/*", "husky"]
    ignore:
      # TypeScript e ESLint estão fixados por decisão registrada em
      # documents/specs/2026-08-22-frontend-scaffold-design.md: o TS 7 desliga
      # as regras de lint com tipo (peer `<6.1.0` do typescript-eslint) e
      # nenhum plugin suporta o ESLint 10. Subir major aqui quebra o gate em
      # silêncio, então o major fica fora do automático de propósito.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # O major de @types/node acompanha o major do Node, não o calendário do
      # npm: tipos à frente do runtime fazem o TypeScript aceitar API que o
      # Node do `.nvmrc` não tem, e nada reprova — o erro só aparece em
      # produção. Quem manda aqui é o `.nvmrc`, então o major sobe junto com
      # ele, na mão.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # O jest-environment-jsdom 30.5.0 tornou a suíte 7x mais lenta e estourou
      # o timeout de 5s em três testes de `companies-page.test.tsx` — os que
      # digitam com `userEvent`. Medido, com o resto da árvore igual:
      #
      #   env 30.4.1  ->  11 passed,  2,2 s
      #   env 30.5.0  ->   3 failed, 81,9 s
      #
      # Não é o jsdom: a lib por baixo é a 26.1.0 nas duas. Não é o jest nem o
      # @testing-library/react: a suíte inteira passa em 7,2 s com jest 30.5.1
      # e RTL 16.3.3, desde que o env fique em 30.4.1. E o changelog do 30.5.0
      # não traz nenhuma entrada tocando o environment — a medição acima é a
      # única evidência que existe.
      #
      # Fica de fora até alguém entender o que mudou. A saída fácil seria subir
      # o timeout dos três testes, e é a errada: trocaria um vermelho honesto
      # por um verde escondendo a suíte 7x mais lenta.
      # Atenção: o Dependabot lê este arquivo da branch **default** (`main`), não da
      # `development`. Esta regra só passa a valer no release seguinte — até lá o #31
      # continua reprovando, e `@dependabot recreate` não muda isso.
      - dependency-name: jest-environment-jsdom
        versions: [">=30.5.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Sao_Paulo
    target-branch: development
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
