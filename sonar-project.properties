# Configuração do scanner do SonarQube Cloud.
#
# `sonar.organization` e `sonar.projectKey` NÃO ficam aqui de propósito: são
# variables do repositório no GitHub (SONAR_ORGANIZATION e SONAR_PROJECT_KEY) e
# chegam ao scanner pelo `args` do job `sonar` em .github/workflows/ci.yml.
# Assim um fork analisa no próprio projeto sem editar arquivo versionado.
#
# Para rodar o scanner na mão:
#   sonar-scanner -Dsonar.organization=<org> -Dsonar.projectKey=<key>

sonar.sourceEncoding=UTF-8

# Não só `src`: o scanner tem analisadores próprios para Dockerfile, workflows
# do GitHub Actions e shell, e no primeiro scan os três reportaram "no files to
# be analyzed" — a pipeline inteira estava fora do alcance da própria análise
# de qualidade que ela executa.
sonar.sources=src,Dockerfile,.github,scripts
sonar.tests=src,e2e
# `e2e/**` e não só os `.spec.ts`: `e2e/support/fake-api.mjs` é o dublê do backend
# que a suíte sobe, e é código de teste como qualquer outro.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,e2e/**

# Cobertura vem do artefato que o job `quality` produz com `npm run test:coverage`.
# O caminho é relativo à raiz do projeto, como o lcov que o Jest gera.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Código gerado pelo shadcn: o CLI reescreve estes arquivos a cada `shadcn add`,
# então medir code smell neles reporta dívida que ninguém pode pagar sem perder
# a atualização seguinte. Excluído da análise, não só da cobertura.
sonar.exclusions=src/components/ui/**,**/node_modules/**,.next/**,coverage/**

# Fora da métrica de cobertura, mas ainda analisados: arquivo de configuração e
# o layout raiz não têm comportamento próprio para testar.
sonar.coverage.exclusions=**/*.config.*,src/app/layout.tsx,src/test/**,e2e/**

# O parser type-aware do Sonar usa o mesmo tsconfig do build.
sonar.typescript.tsconfigPaths=tsconfig.json
